name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @ordo/desktop build-storybook --quiet

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron downloads its binary on first use: fetch it once here, so parallel Playwright workers
      # do not race on the download (spawn ETXTBSY).
      - run: pnpm --filter @ordo/desktop exec node -e "require('electron')"
      - run: xvfb-run -a pnpm --filter @ordo/desktop e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: apps/desktop/test-results
          retention-days: 7

  package:
    name: Tests and installer (${{ matrix.os }})
    needs: [checks, e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds for now (ADR 0001).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: ordo-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.exe
          if-no-files-found: error
          retention-days: 14
