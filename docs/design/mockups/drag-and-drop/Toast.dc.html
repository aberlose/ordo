<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ordo — message d'erreur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lt{--canvas:#F2F6FF;--surface:#FFFFFF;--rail:#E9EFFC;--border:#DFE6F3;--border-strong:#C4D0E6;--text:#0F1A33;--text-2:#465472;--text-3:#5F6B88;--accent:#1A52E6;--accent-soft:#E2EBFF;--danger:#D92D20;--inverse:#0F1A33;--inverse-fg:#F2F6FF;--inverse-danger:#FF8A80;--inverse-accent:#8DB0FF;--pop:0 12px 32px rgba(15,26,51,.18),0 2px 6px rgba(15,26,51,.08)}
.dk{--canvas:#0A1020;--surface:#121B30;--rail:#172340;--border:#20304F;--border-strong:#2E4068;--text:#E7EEFB;--text-2:#A2B1CE;--text-3:#7B8BAB;--accent:#5B8CFF;--accent-soft:#16294F;--danger:#FF8A80;--inverse:#E7EEFB;--inverse-fg:#0A1020;--inverse-danger:#D92D20;--inverse-accent:#1A52E6;--pop:0 12px 32px rgba(0,0,0,.6)}
.ghost{height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--border);opacity:.7}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 700px; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 26px; background: #F7F8FB; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; color: #0F1A33">

<sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{v.title}}</h2>
<p style="margin: 0; font-size: 13px; color: #465472; line-height: 1.5">{{v.desc}}</p>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}" style="position: relative; height: 230px; overflow: hidden; background: var(--canvas); color: var(--text); border-radius: 14px; border: 1px solid var(--border); padding: 16px 20px; box-sizing: border-box">
<div style="font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px">{{th.name}}</div>
<div aria-hidden="true" style="display: flex; gap: 24px">
<div style="width: 180px; display: flex; flex-direction: column; gap: 8px"><div style="height: 2px; background: #78716C; margin-bottom: 4px"></div><div class="ghost"></div><div class="ghost"></div></div>
<div style="width: 180px; display: flex; flex-direction: column; gap: 8px"><div style="height: 2px; background: #2563EB; margin-bottom: 4px"></div><div class="ghost"></div></div>
<div style="width: 180px; display: flex; flex-direction: column; gap: 8px"><div style="height: 2px; background: #16A34A; margin-bottom: 4px"></div><div class="ghost"></div></div>
</div>

<sc-if value="{{v.isA}}" hint-placeholder-val="{{true}}">
<div role="status" style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 10px; background: var(--inverse); color: var(--inverse-fg); box-shadow: var(--pop); font-size: 13px; white-space: nowrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--inverse-danger)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
<span>Déplacement non enregistré : la carte a repris sa place.</span>
<button style="height: 26px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--inverse-accent); font-weight: 600">Réessayer</button>
<button aria-label="Fermer" style="width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--inverse-fg); opacity: .7; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
</sc-if>

<sc-if value="{{v.isB}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; right: 18px; bottom: 18px; width: 320px; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--pop)">
<div style="display: flex; gap: 12px; padding: 12px 10px 12px 14px">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: color-mix(in srgb, var(--danger) 14%, transparent); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17v.01"/></svg></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 13.5px; font-weight: 600">Modification non enregistrée</span>
<span style="font-size: 12.5px; color: var(--text-2); line-height: 1.45">« Rédiger le compte rendu » est revenue dans À faire.</span>
<button style="align-self: flex-start; margin-top: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600">Réessayer</button>
</div>
<button aria-label="Fermer" style="width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--text-3); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div style="height: 3px; background: var(--rail)"><div style="height: 3px; width: 62%; background: var(--danger); opacity: .6"></div></div>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themes: [{ cls: 'lt', name: 'Clair' }, { cls: 'dk', name: 'Sombre' }],
      variants: [
        { title: 'A · Bandeau compact en bas au centre', desc: 'Une ligne en couleurs inversées, au centre en bas. Disparaît après 6 s ou au clic sur ×. Le texte s’adapte : « Déplacement… », « Ajout… », « Modification… non enregistré(e) ».', isA: true, isB: false },
        { title: 'B · Carte en bas à droite', desc: 'Titre, explication avec le nom de la tâche, bouton Réessayer et barre de temps restant. Plus d’information, plus visible ; plusieurs messages s’empilent.', isA: false, isB: true }
      ]
    };
  }
}
</script>
</body>
</html>
