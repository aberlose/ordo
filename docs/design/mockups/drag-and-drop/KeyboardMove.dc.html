<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ordo — déplacer au clavier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lt{--canvas:#F2F6FF;--surface:#FFFFFF;--rail:#E9EFFC;--border:#DFE6F3;--border-strong:#C4D0E6;--text:#0F1A33;--text-2:#465472;--text-3:#5F6B88;--accent:#1A52E6;--accent-fg:#FFFFFF;--accent-soft:#E2EBFF;--shadow:0 1px 3px rgba(15,26,51,.06),0 1px 1px rgba(15,26,51,.04);--pop:0 12px 32px rgba(15,26,51,.16),0 2px 6px rgba(15,26,51,.06)}
.dk{--canvas:#0A1020;--surface:#121B30;--rail:#172340;--border:#20304F;--border-strong:#2E4068;--text:#E7EEFB;--text-2:#A2B1CE;--text-3:#7B8BAB;--accent:#5B8CFF;--accent-fg:#06101F;--accent-soft:#16294F;--shadow:0 1px 3px rgba(0,0,0,.5);--pop:0 12px 32px rgba(0,0,0,.55)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px 11px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.ttl{font-size:14px;font-weight:500;line-height:1.4}
.meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-3)}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:10px}
.bars span{width:2.5px;border-radius:1px}
kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 26px; background: #F7F8FB; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; color: #0F1A33">

<sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{v.title}}</h2>
<p style="margin: 0; font-size: 13px; color: #465472; line-height: 1.5">{{v.desc}}</p>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}" style="position: relative; height: 330px; overflow: hidden; background: var(--canvas); color: var(--text); border-radius: 14px; border: 1px solid var(--border); padding: 16px 20px; box-sizing: border-box">
<div style="font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px">{{th.name}} — après <kbd>⌥</kbd> <kbd>→</kbd></div>
<div style="display: flex; gap: 28px; align-items: flex-start">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
<section style="width: 280px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 2px 10px; border-bottom: 2px solid {{col.c}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{col.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{col.icon}}"/></svg>
<h3 style="margin: 0; font-size: 14px; font-weight: 600">{{col.name}}</h3>
<span style="font-size: 13px; color: var(--text-3)">{{col.count}}</span>
</div>
<sc-for list="{{col.items}}" as="it" hint-placeholder-count="2">
<article class="card" style="outline: {{it.outline}}; outline-offset: 2px; background: {{it.bg}}">
<div class="ttl">{{it.t}}</div>
<div class="meta"><span class="bars" aria-hidden="true"><sc-for list="{{it.bars}}" as="b" hint-placeholder-count="5"><span style="height: {{b.h}}; background: {{b.c}}"></span></sc-for></span><span style="flex: 1"></span><span>{{it.due}}</span></div>
</article>
<sc-if value="{{it.chip}}" hint-placeholder-val="{{false}}">
<sc-if value="{{v.isA}}" hint-placeholder-val="{{true}}">
<div style="align-self: flex-start; display: flex; align-items: center; gap: 6px; margin-top: -2px; padding: 4px 8px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--pop); font-size: 12px; color: var(--text-2)"><kbd>⌥</kbd><kbd>↑</kbd><kbd>↓</kbd> ordre <span style="color: var(--text-3)">·</span> <kbd>⌥</kbd><kbd>←</kbd><kbd>→</kbd> colonne</div>
</sc-if>
</sc-if>
</sc-for>
</section>
</sc-for>
</div>
<sc-if value="{{v.isB}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--pop); font-size: 12.5px; color: var(--text-2); white-space: nowrap">
<span style="font-weight: 600; color: var(--text)">1 carte sélectionnée</span>
<span style="color: var(--text-3)">·</span><kbd>⌥</kbd><kbd>↑↓</kbd> ordre
<span style="color: var(--text-3)">·</span><kbd>⌥</kbd><kbd>←→</kbd> colonne
<span style="color: var(--text-3)">·</span><kbd>Entrée</kbd> ouvrir
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const PC = ['#94A3B8', '#3B82F6', '#CA8A04', '#EA580C', '#DC2626'];
const bars = (p) => [3.6, 5.2, 6.8, 8.4, 10].map((h, i) => ({ h: h + 'px', c: i < p ? PC[p - 1] : 'var(--border-strong)' }));
const card = (t, p, due, focused) => ({ t, bars: bars(p), due, chip: !!focused, outline: focused ? '2px solid var(--accent)' : 'none', bg: focused ? 'color-mix(in srgb, var(--accent-soft) 70%, var(--surface))' : 'var(--surface)' });
const INBOX = 'M22 12h-6l-2 3h-4l-2-3H2M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z';
const PLAY = 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM10 8.5v7l5.5-3.5z';
class Component extends DCLogic {
  renderVals() {
    return {
      themes: [{ cls: 'lt', name: 'Clair' }, { cls: 'dk', name: 'Sombre' }],
      cols: [
        { name: 'À faire', c: '#78716C', icon: INBOX, count: 2, items: [card('Mettre à jour les dépendances', 2, '14 oct.'), card('Préparer la démo client', 3, '')] },
        { name: 'En cours', c: '#2563EB', icon: PLAY, count: 2, items: [card('Rédiger le compte rendu de l’atelier', 4, '12 oct.', true), card('Intégrer le nouveau header', 5, '17 oct.')] }
      ],
      variants: [
        { title: 'A · Aide sous la carte', desc: 'La carte déplacée garde le focus (anneau accent) et s’éclaire brièvement. Une petite aide apparaît sous la carte quand elle a le focus clavier. Lecteur d’écran : « Déplacée dans En cours, position 1 sur 2 ».', isA: true, isB: false },
        { title: 'B · Barre d’aide en bas du board', desc: 'Même retour sur la carte. L’aide est une barre centrée en bas du board, affichée tant qu’une carte a le focus clavier ; elle rappelle aussi Entrée pour ouvrir.', isA: false, isB: true }
      ]
    };
  }
}
</script>
</body>
</html>
