<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ordo — menus Statut et Priorité</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lt{--canvas:#F2F6FF;--surface:#FFFFFF;--rail:#E9EFFC;--border:#DFE6F3;--border-strong:#C4D0E6;--text:#0F1A33;--text-2:#465472;--text-3:#5F6B88;--accent:#1A52E6;--accent-fg:#FFFFFF;--accent-soft:#E2EBFF;--danger:#D92D20;--pop:0 12px 32px rgba(15,26,51,.16),0 2px 6px rgba(15,26,51,.06)}
.dk{--canvas:#0A1020;--surface:#121B30;--rail:#172340;--border:#20304F;--border-strong:#2E4068;--text:#E7EEFB;--text-2:#A2B1CE;--text-3:#7B8BAB;--accent:#5B8CFF;--accent-fg:#06101F;--accent-soft:#16294F;--danger:#FF8A80;--pop:0 12px 32px rgba(0,0,0,.55)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.prop{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;margin-left:-8px;border:0;border-radius:6px;background:none;font-size:13.5px;text-align:left}
.lbl{font-size:13px;color:var(--text-3);width:88px;flex-shrink:0}
.opt{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;font-size:13.5px;border:0;background:none;width:100%;text-align:left}
.grp{padding:8px 8px 4px;font-size:11.5px;color:var(--text-3);font-weight:500}
kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-3)}
</style>
</helmet>
<div style="width: 1440px; height: 600px; box-sizing: border-box; padding: 28px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; background: #F7F8FB; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; color: #0F1A33">

<sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{v.title}}</h2>
<p style="margin: 0; font-size: 13px; color: #465472; line-height: 1.5">{{v.desc}}</p>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
<sc-for list="{{v.panels}}" as="pn" hint-placeholder-count="2">
<div class="{{pn.cls}}" style="position: relative; background: var(--surface); color: var(--text); border-radius: 14px; padding: 18px; border: 1px solid var(--border); min-height: 470px; box-sizing: border-box">
<div style="font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px">{{pn.name}}</div>

<div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; background: var(--canvas); border: 1px solid var(--border)">
<div style="display: flex; align-items: center"><span class="lbl">Statut</span><button class="prop" aria-haspopup="listbox" aria-expanded="{{pn.statusOpen}}" style="background: {{pn.statusBg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg>En cours<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>

<sc-if value="{{v.isA}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center"><span class="lbl">Priorité</span><button class="prop" aria-haspopup="listbox" aria-expanded="{{pn.prioOpen}}" style="background: {{pn.prioBg}}"><span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 1.5px; height: 10px"><span style="width: 2.5px; height: 3.6px; border-radius: 1px; background: #EA580C"></span><span style="width: 2.5px; height: 5.2px; border-radius: 1px; background: #EA580C"></span><span style="width: 2.5px; height: 6.8px; border-radius: 1px; background: #EA580C"></span><span style="width: 2.5px; height: 8.4px; border-radius: 1px; background: #EA580C"></span><span style="width: 2.5px; height: 10px; border-radius: 1px; background: var(--border-strong)"></span></span>Haute<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
</sc-if>

<sc-if value="{{v.isB}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; padding: 4px 0"><span class="lbl">Priorité</span>
<div role="radiogroup" aria-label="Priorité" style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; gap: 3px">
<sc-for list="{{seg}}" as="s" hint-placeholder-count="5">
<button role="radio" aria-checked="{{s.on}}" aria-label="{{s.l}}" title="{{s.l}}" style="width: 30px; height: 26px; border-radius: 6px; border: 1px solid {{s.border}}; background: {{s.bg}}; display: flex; align-items: flex-end; justify-content: center; padding: 0 0 6px"><span style="width: 4px; height: {{s.h}}; border-radius: 1.5px; background: {{s.c}}"></span></button>
</sc-for>
</div>
<span style="font-size: 12px; color: var(--text-2)">Haute · <kbd>1</kbd>–<kbd>5</kbd></span>
</div>
</div>
</sc-if>

<div style="display: flex; align-items: center"><span class="lbl">Début</span><button class="prop" style="color: var(--text-3)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Aucune</button></div>
<div style="display: flex; align-items: center"><span class="lbl">Échéance</span><button class="prop"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>17 oct. 2026</button></div>
</div>

<sc-if value="{{pn.statusOpen}}" hint-placeholder-val="{{false}}">
<div role="listbox" aria-label="Statut" style="position: absolute; left: 122px; top: 104px; width: 232px; padding: 6px; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--pop); display: flex; flex-direction: column; gap: 1px; z-index: 2">
<sc-if value="{{v.isB}}" hint-placeholder-val="{{false}}">
<label style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin-bottom: 4px; border-bottom: 1px solid var(--border)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input aria-label="Filtrer les colonnes" placeholder="Déplacer vers…" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 13.5px"></label>
</sc-if>
<sc-for list="{{v.statusRows}}" as="r" hint-placeholder-count="5">
<sc-if value="{{r.isGroup}}" hint-placeholder-val="{{false}}"><div class="grp">{{r.l}}</div></sc-if>
<sc-if value="{{r.isOpt}}" hint-placeholder-val="{{true}}">
<button role="option" aria-selected="{{r.sel}}" class="opt" style="background: {{r.bg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{r.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg><span style="flex: 1">{{r.l}}</span><sc-if value="{{r.sel}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></sc-if></button>
</sc-if>
</sc-for>
</div>
</sc-if>

<sc-if value="{{pn.prioOpen}}" hint-placeholder-val="{{false}}">
<div role="listbox" aria-label="Priorité" style="position: absolute; left: 122px; top: 138px; width: 220px; padding: 6px; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--pop); display: flex; flex-direction: column; gap: 1px; z-index: 2">
<sc-for list="{{prioRows}}" as="r" hint-placeholder-count="5">
<button role="option" aria-selected="{{r.sel}}" class="opt" style="background: {{r.bg}}"><span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 1.5px; height: 10px; width: 20px"><sc-for list="{{r.bars}}" as="b" hint-placeholder-count="5"><span style="width: 2.5px; height: {{b.h}}; border-radius: 1px; background: {{b.c}}"></span></sc-for></span><span style="flex: 1">{{r.l}}</span><sc-if value="{{r.sel}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></sc-if><kbd>{{r.k}}</kbd></button>
</sc-for>
</div>
</sc-if>

</div>
</sc-for>
</div>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":600}}'>
const PC = ['#94A3B8', '#3B82F6', '#CA8A04', '#EA580C', '#DC2626'];
const PL = ['Très basse', 'Basse', 'Moyenne', 'Haute', 'Très haute'];
const H = [3.6, 5.2, 6.8, 8.4, 10];
const bars = (p) => H.map((h, i) => ({ h: h + 'px', c: i < p ? PC[p - 1] : 'var(--border-strong)' }));
const IC = {
  inbox: 'M22 12h-6l-2 3h-4l-2-3H2M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z',
  play: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM10 8.5v7l5.5-3.5z',
  eye: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  pause: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM10 9v6M14 9v6',
  check: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM8 12l3 3 5-6'
};
const COLS = [
  { l: 'À faire', c: '#78716C', icon: IC.inbox, g: 'À faire' },
  { l: 'En cours', c: '#2563EB', icon: IC.play, g: 'En cours', sel: true },
  { l: 'En revue', c: '#7C3AED', icon: IC.eye, g: 'En cours' },
  { l: 'Bloqué', c: '#DC2626', icon: IC.pause, g: 'En cours', hover: true },
  { l: 'Terminé', c: '#16A34A', icon: IC.check, g: 'Terminé' }
];
const opt = (c) => ({ ...c, isOpt: true, isGroup: false, sel: !!c.sel, bg: c.sel ? 'var(--accent-soft)' : c.hover ? 'var(--rail)' : 'transparent' });
const flat = COLS.map(opt);
const grouped = [];
let last = null;
for (const c of COLS) { if (c.g !== last) { grouped.push({ isGroup: true, isOpt: false, l: c.g }); last = c.g; } grouped.push(opt(c)); }
class Component extends DCLogic {
  renderVals() {
    const lt = { cls: 'lt', name: 'Clair — menu Statut ouvert', statusOpen: true, prioOpen: false, statusBg: 'var(--rail)', prioBg: 'transparent' };
    return {
      variants: [
        { title: 'A · Deux menus déroulants', desc: 'Statut et Priorité s’ouvrent comme les menus de filtres du board. Colonnes dans l’ordre du board ; raccourcis 1–5 dans le menu Priorité.', isA: true, isB: false, statusRows: flat,
          panels: [lt, { cls: 'dk', name: 'Sombre — menu Priorité ouvert', statusOpen: false, prioOpen: true, statusBg: 'transparent', prioBg: 'var(--rail)' }] },
        { title: 'B · Statut cherchable, priorité en un clic', desc: 'Le menu Statut a un champ « Déplacer vers… » et regroupe les colonnes par catégorie. La priorité devient 5 boutons directement dans la fiche : un clic, pas de menu.', isA: false, isB: true, statusRows: grouped,
          panels: [lt, { cls: 'dk', name: 'Sombre — au repos', statusOpen: false, prioOpen: false, statusBg: 'transparent', prioBg: 'transparent' }] }
      ],
      prioRows: [5, 4, 3, 2, 1].map((p) => ({ l: PL[p - 1], k: String(p), bars: bars(p), sel: p === 4, bg: p === 4 ? 'var(--accent-soft)' : 'transparent' })),
      seg: [1, 2, 3, 4, 5].map((p) => ({ l: PL[p - 1], h: H[p - 1] + 4 + 'px', on: p === 4, c: p <= 4 ? PC[3] : 'var(--border-strong)', bg: p === 4 ? 'var(--accent-soft)' : 'var(--surface)', border: p === 4 ? 'var(--accent)' : 'var(--border)' }))
    };
  }
}
</script>
</body>
</html>
