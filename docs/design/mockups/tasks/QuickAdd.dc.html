<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ordo — ajout rapide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lt{--canvas:#F2F6FF;--surface:#FFFFFF;--rail:#E9EFFC;--border:#DFE6F3;--border-strong:#C4D0E6;--text:#0F1A33;--text-2:#465472;--text-3:#5F6B88;--accent:#1A52E6;--accent-bg:linear-gradient(135deg,#1A52E6 0%,#2B6CF0 100%);--accent-fg:#FFFFFF;--accent-soft:#E2EBFF;--danger:#D92D20;--shadow:0 1px 3px rgba(15,26,51,.06),0 1px 1px rgba(15,26,51,.04);--pop:0 12px 32px rgba(15,26,51,.16),0 2px 6px rgba(15,26,51,.06)}
.dk{--canvas:#0A1020;--surface:#121B30;--rail:#172340;--border:#20304F;--border-strong:#2E4068;--text:#E7EEFB;--text-2:#A2B1CE;--text-3:#7B8BAB;--accent:#5B8CFF;--accent-bg:linear-gradient(135deg,#3D73FF 0%,#4FA3FF 100%);--accent-fg:#06101F;--accent-soft:#16294F;--danger:#FF8A80;--shadow:0 1px 3px rgba(0,0,0,.5);--pop:0 12px 32px rgba(0,0,0,.55)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
</style>
</helmet>
<div style="width: 1440px; height: 620px; box-sizing: border-box; padding: 28px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; background: #F7F8FB; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; color: #0F1A33">

<sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{v.title}}</h2>
<p style="margin: 0; font-size: 13px; color: #465472; line-height: 1.5">{{v.desc}}</p>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}" style="background: var(--canvas); color: var(--text); border-radius: 14px; padding: 20px 18px 24px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; min-height: 470px; box-sizing: border-box">
<div style="font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em">{{th.name}}</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 0 2px 10px; border-bottom: 2px solid #78716C">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78716C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></svg>
<h3 style="margin: 0; font-size: 14px; font-weight: 600">À faire</h3>
<span style="font-size: 13px; color: var(--text-3)">{{v.count}}</span>
<div style="flex: 1"></div>
<button aria-label="Ajouter une tâche" style="border: 0; background: none; padding: 4px; color: var(--text-3); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button aria-label="Réglages de la colonne" style="border: 0; background: none; padding: 4px; color: var(--text-3); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</div>

<sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
<article style="background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 11px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 9px">
<div style="font-size: 14px; font-weight: 500; line-height: 1.4">{{c.t}}</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-3)">
<span role="img" aria-label="Priorité {{c.pl}}" style="display: flex; align-items: flex-end; gap: 1.5px; height: 10px"><sc-for list="{{c.bars}}" as="b" hint-placeholder-count="5"><span style="width: 2.5px; height: {{b.h}}; border-radius: 1px; background: {{b.c}}"></span></sc-for></span>
<div style="flex: 1"></div>
<span>{{c.due}}</span>
</div>
</article>
</sc-for>

<sc-if value="{{v.isB}}" hint-placeholder-val="{{false}}">
<article style="background: color-mix(in srgb, var(--accent-soft) 70%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 10px; padding: 12px 14px 11px; display: flex; flex-direction: column; gap: 9px">
<div style="font-size: 14px; font-weight: 500; line-height: 1.4">Relire le contrat de maintenance</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-3)">
<span role="img" aria-label="Priorité Moyenne" style="display: flex; align-items: flex-end; gap: 1.5px; height: 10px"><span style="width: 2.5px; height: 3.6px; border-radius: 1px; background: #CA8A04"></span><span style="width: 2.5px; height: 5.2px; border-radius: 1px; background: #CA8A04"></span><span style="width: 2.5px; height: 6.8px; border-radius: 1px; background: #CA8A04"></span><span style="width: 2.5px; height: 8.4px; border-radius: 1px; background: var(--border-strong)"></span><span style="width: 2.5px; height: 10px; border-radius: 1px; background: var(--border-strong)"></span></span>
<div style="flex: 1"></div>
<span style="color: var(--accent); font-weight: 500">Ajoutée</span>
</div>
</article>
<label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft)">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<input aria-label="Titre de la nouvelle tâche" value="Préparer la démo client" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 14px">
<kbd>↵</kbd>
</label>
<div style="font-size: 12px; color: var(--text-3); padding: 0 4px">Le champ reste ouvert pour enchaîner · <kbd>Échap</kbd> ferme</div>
</sc-if>

<sc-if value="{{v.isA}}" hint-placeholder-val="{{true}}">
<div style="background: var(--surface); border: 1.5px solid var(--accent); border-radius: 10px; padding: 12px 14px 10px; box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); display: flex; flex-direction: column; gap: 10px">
<textarea aria-label="Titre de la nouvelle tâche" rows="2" style="border: 0; outline: none; resize: none; background: none; font: inherit; font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--text); padding: 0">Préparer la démo client pour le comité de jeudi</textarea>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px"><kbd>↵</kbd> ajouter <kbd>Échap</kbd> fermer</span>
<div style="flex: 1"></div>
<button style="height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--accent-bg); color: var(--accent-fg); font-size: 13px; font-weight: 500">Ajouter</button>
</div>
</div>
<div style="font-size: 12px; color: var(--text-3); padding: 0 4px">Après ↵, la carte est créée et un nouvel éditeur vide s'ouvre en dessous.</div>
</sc-if>

</div>
</sc-for>
</div>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":620}}'>
const PC = ['#94A3B8', '#3B82F6', '#CA8A04', '#EA580C', '#DC2626'];
const PL = ['Très basse', 'Basse', 'Moyenne', 'Haute', 'Très haute'];
const bars = (p) => [3.6, 5.2, 6.8, 8.4, 10].map((h, i) => ({ h: h + 'px', c: i < p ? PC[p - 1] : 'var(--border-strong)' }));
class Component extends DCLogic {
  renderVals() {
    return {
      variants: [
        { title: 'A · Carte en cours d’écriture', desc: 'L’éditeur a la forme d’une carte : on voit déjà où elle va atterrir. Titre sur plusieurs lignes, bouton Ajouter pour la souris.', isA: true, isB: false, count: '2' },
        { title: 'B · Champ compact sur une ligne', desc: 'Le lien « Ajouter » devient un champ. Plus discret ; la carte créée s’affiche au-dessus, brièvement surlignée.', isA: false, isB: true, count: '3' }
      ],
      themes: [{ cls: 'lt', name: 'Clair' }, { cls: 'dk', name: 'Sombre' }],
      cards: [
        { t: 'Mettre à jour les dépendances', pl: PL[1], bars: bars(2), due: '14 oct.' },
        { t: 'Rédiger le compte rendu de l’atelier', pl: PL[3], bars: bars(4), due: '12 oct.' }
      ]
    };
  }
}
</script>
</body>
</html>
